name: Deploy Angular to GitHub Pages

on:
  # Déploie après chaque push sur main.
  push:
    branches: ["main"]

  # Permet aussi un lancement manuel depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Évite de publier plusieurs versions en même temps.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Récupère les fichiers du dépôt.
      - name: Checkout
        uses: actions/checkout@v4

      # Installe Node.js et met en cache les téléchargements npm.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Récupère les informations de publication GitHub Pages.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Installe les versions exactes du package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Adapte automatiquement le base-href à l'adresse du site.
      - name: Build Angular
        run: >
          npx ng build
          --configuration production
          --base-href "${{ steps.pages.outputs.base_path }}/"

      # Cherche le dossier contenant le index.html compilé.
      - name: Find build output
        id: build-output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d dist ]; then
            echo "::error::Le dossier dist n'existe pas. Vérifie les options de build."
            exit 1
          fi

          # Les builders Angular récents utilisent un dossier browser.
          mapfile -t index_files < <(
            find dist -type f -path '*/browser/index.html'
          )

          # Sinon, cherche une sortie directement dans dist ou dans dist/nom-du-projet.
          if [ "${#index_files[@]}" -eq 0 ]; then
            mapfile -t index_files < <(
              find dist -maxdepth 2 -type f -name index.html \
                -not -path 'dist/server/*'
            )
          fi

          # Arrête le workflow plutôt que de publier un dossier ambigu.
          if [ "${#index_files[@]}" -ne 1 ]; then
            echo "::error::Impossible d'identifier un seul index.html compilé."
            printf '%s\n' "${index_files[@]}"
            exit 1
          fi

          output_dir="$(dirname "${index_files[0]}")"
          echo "Dossier a publier : $output_dir"
          echo "path=$output_dir" >> "$GITHUB_OUTPUT"

      # Transmet uniquement les fichiers compilés à GitHub Pages.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build-output.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5