<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="100%" height="100%" role="img" aria-label="Le Club des Cerveaux, depuis 2013 : à tous moments, ça part !">
  <title>Le Club des Cerveaux</title>

  <defs>
    <!-- Vichy rouge et blanc du bob -->
    <pattern id="gingham" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff" />
      <rect width="4" height="8" fill="#e2202f" fill-opacity="0.78" />
      <rect width="8" height="4" fill="#e2202f" fill-opacity="0.78" />
    </pattern>
    <!-- Le bas du bob, dans l'ombre -->
    <linearGradient id="hat-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#4a0008" stop-opacity="0" />
      <stop offset="1" stop-color="#4a0008" stop-opacity="0.34" />
    </linearGradient>
    <!-- La vache : les taches brunes sont rognées au contour du corps -->
    <clipPath id="cow-body">
      <path d="M102 132 L128 118 L332 118 L470 124 L548 112 L566 104 L588 136 L622 190 Q628 212 604 220 L548 216 L502 252 L474 266 L452 300 Q360 318 216 304 Q150 300 108 302 Z" />
