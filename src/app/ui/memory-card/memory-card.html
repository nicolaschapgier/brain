@for (memory of shown(); track memory.id) {
  <mat-card
    class="sticker"
    appearance="raised"
    role="dialog"
    [attr.aria-label]="memory.title"
    (pointermove)="tilt($event)"
    (pointerleave)="resetTilt($event)"
  >
    <div class="face">
      <header class="top">
        <span class="number" [attr.aria-label]="'Souvenir numéro ' + number() + ' sur ' + total()">
          N°<b>{{ number() }}</b><small>/{{ total() }}</small>
        </span>
        <span class="crest" aria-hidden="true">⚜</span>
      </header>

      <figure class="window">
        @if (memory.image && brokenImage() !== memory.image) {
          <img mat-card-image class="photo" [src]="memory.image" [alt]="memory.title" (error)="brokenImage.set(memory.image)" />
        } @else {
          <div class="photo photo--empty" aria-hidden="true">⚜</div>
        }
        <span class="foil" aria-hidden="true"></span>
      </figure>

      <div class="nameplate">
        <mat-card-title class="name">{{ memory.title }}</mat-card-title>
      </div>

      <mat-card-content class="sheet">
        @if (memory.date) {
          <p class="stat"><span class="label">Date</span> {{ formatDate(memory.date) }}</p>
        }
        @if (memory.description) {
          <p class="description">{{ memory.description }}</p>
        }
      </mat-card-content>

      <footer class="edition">Édition Berry · Châteauroux</footer>

      <mat-card-actions class="actions" align="end">
        <button mat-icon-button matTooltip="Souvenir précédent" aria-label="Souvenir précédent" (click)="store.previous()">
          <mat-icon>chevron_left</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Souvenir suivant" aria-label="Souvenir suivant" (click)="store.next()">
          <mat-icon>chevron_right</mat-icon>
        </button>
        <button mat-button (click)="store.select(null)">Fermer</button>
      </mat-card-actions>
    </div>

    <span class="foil foil--sticker" aria-hidden="true"></span>
  </mat-card>
}
